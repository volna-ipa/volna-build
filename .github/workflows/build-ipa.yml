name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    # macos-15 arm64 runners are heavily oversubscribed; the Intel pool
    # starts much faster and is fine for an unsigned archive.
    runs-on: macos-15-intel
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create empty secrets config
        run: |
          printf 'SOUNDCLOUD_CLIENT_ID =\nSOUNDCLOUD_CLIENT_SECRET =\n' > Config/Secrets.xcconfig

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Archive unsigned app
        run: |
          xcodebuild \
            -project Volna.xcodeproj \
            -scheme Volna \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Volna.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Volna.xcarchive/Products/Applications/Volna.app build/Payload/
          cd build
          zip -qry Volna-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Volna-unsigned-ipa
          path: build/Volna-unsigned.ipa
          if-no-files-found: error
